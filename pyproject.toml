[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teams-core"
version = "0.1.0"
description = "Framework-free Microsoft Teams integration via Graph API"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.28",
    "httpx>=0.27",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "azure-storage-blob>=12.19",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "redis>=5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
